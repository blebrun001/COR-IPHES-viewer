[package]
name = "cor-iphes-esqueletos-off-linea"
version = "0.1.0-alpha.1"
description = "COR-IPHES Esqueletos Off-linea desktop application"
authors = ["IPHES-CERCA"]
license = "CC-BY-NC-4.0"
edition = "2021"

[lib]
name = "cor_iphes_esqueletos_off_linea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cor-iphes-esqueletos-off-linea"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream", "gzip", "brotli", "deflate", "zstd"] }
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
